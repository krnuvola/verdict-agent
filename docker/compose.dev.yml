services:
  agentdb:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AGENTDB_USER:?Set AGENTDB_USER in .env}
      POSTGRES_PASSWORD: ${AGENTDB_PASSWORD:?Set AGENTDB_PASSWORD in .env}
      POSTGRES_DB: agentdb
    ports:
      - "5433:5432"
    volumes:
      - agentdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d agentdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BLOB_S3_KEY:?Set BLOB_S3_KEY in .env}
      MINIO_ROOT_PASSWORD: ${BLOB_S3_SECRET:?Set BLOB_S3_SECRET in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-02-08T19-14-21Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until mc alias set local http://minio:9000 "$$BLOB_S3_KEY" "$$BLOB_S3_SECRET";
        do sleep 2; done;
        mc mb --ignore-existing local/gba
    environment:
      BLOB_S3_KEY: ${BLOB_S3_KEY:?Set BLOB_S3_KEY in .env}
      BLOB_S3_SECRET: ${BLOB_S3_SECRET:?Set BLOB_S3_SECRET in .env}

  agent-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${AGENTDB_USER}:${AGENTDB_PASSWORD}@agentdb:5432/agentdb
      BLOB_URL: s3://gba?endpoint=http://minio:9000
      BROWSER_MODE: headed
      NOVNC_BASE_URL: http://localhost:6080
      SESSION_DIR: /sessions
      TRAJ_DIR: /trajectory
      GRAPH_API_URL: ${GRAPH_API_URL:-http://graph-api:8101}
      WORKBENCH_API_URL: ${WORKBENCH_API_URL:-http://workbench-api:8102}
      PEER_MODE: ${PEER_MODE:-live}
    depends_on:
      agentdb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8100:8100"
      - "6080:6080"
    volumes:
      - ../trajectory:/trajectory
      - ../.sessions:/sessions
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  agentdb:
  minio:
